# The boot menu (Limine, https://github.com/limine-bootloader/limine, CONFIG.md):
# InstantOS through iboot, Windows' boot manager, Arch Linux's unified kernel
# image. Placed next to Limine's executable (\EFI\Limine\limine.conf on the PC,
# \EFI\BOOT\limine.conf on the QEMU disk of tools/boot/make-boot-disk.sh), which
# Limine reads before searching the disk.
#
# `cmdline` of an efi entry reaches the program as its UEFI load options; iboot
# reads its settings from there before \EFI\InstantOS\iboot.cfg.

timeout: 5
default_entry: 1
remember_last_entry: no

/InstantOS
    comment: InstantOS, through iboot
    protocol: efi
    path: boot():/EFI/InstantOS/iboot.efi

/InstantOS (live, installer)
    comment: InstantOS from its initrd alone, no disk mounted: run instant-install here
    protocol: efi
    path: boot():/EFI/InstantOS/iboot.efi
    cmdline: root=none

/Windows
    comment: Windows Boot Manager
    protocol: efi
    path: boot():/EFI/Microsoft/Boot/bootmgfw.efi

/Arch Linux
    comment: Arch Linux (unified kernel image on the EFI partition)
    protocol: efi
    path: boot():/EFI/Linux/arch-linux.efi
