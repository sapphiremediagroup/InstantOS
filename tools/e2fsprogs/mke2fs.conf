# mke2fs's settings on InstantOS (/lib/e2fsprogs/mke2fs.conf, MKE2FS_CONFIG):
# the feature set the kernel's ext4 driver is tested with (the suite disks of
# tools/os-testsuite/build-testsuite-iso.sh, the fixtures): base features
# without dir_index, plus has_journal and extent, given by instant-install's -O.
# Newer defaults (metadata_csum, 64bit, flex_bg, orphan_file, ...) are left out
# until the driver is tested with them.
[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,ext_attr
	enable_periodic_fsck = 0
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384
